services:
  app:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command:
      - /bin/sh
      - -c
      - >-
        trap 'printf term > /state/signal; exit 0' TERM;
        while sleep 1; do :; done
    stop_signal: SIGTERM
    volumes:
      - lifecycle-state:/state
      - .:/workspaces/devcontainer-parity

volumes:
  lifecycle-state: {}

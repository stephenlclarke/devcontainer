services:
  app:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command:
      - /bin/sh
      - -c
      - >-
        trap 'printf term > /state/signal; exit 0' TERM;
        while sleep 1; do :; done
    stop_signal: SIGTERM
    volumes:
      - lifecycle-state:/state
      - .:/workspaces/devcontainer-parity

volumes:
  lifecycle-state: {}

services:
  app:
    image: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/devcontainer-vscode-http;
        printf 'devcontainer-vscode\n' > /tmp/devcontainer-vscode-http/index.html;
        python3 -m http.server 8123
        --bind 0.0.0.0
        --directory /tmp/devcontainer-vscode-http
        >/tmp/devcontainer-vscode-http.log 2>&1 &
        while sleep 1; do :; done
    volumes:
      - .:/workspaces/vscode-parity

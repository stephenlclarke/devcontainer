sonar.projectKey=stephenlclarke_devcontainer
sonar.organization=stephenlclarke
sonar.projectName=devcontainer
sonar.sources=Sources
sonar.tests=Tests,Tools
sonar.sourceEncoding=UTF-8
sonar.exclusions=.build/**,_site/**,dist/**
sonar.coverage.exclusions=Sources/DevContainerCLI/DevContainerCommand.swift,Sources/DevContainerCore/DevContainerProject.swift
sonar.coverageReportPaths=coverage.xml
sonar.python.version=3.10

# Docker API routes and Apple guest/default filesystem locations are protocol
# constants, not deployment URIs. Full-record initializers are intentional for
# Codable runtime/state value models and immutable provenance records.
sonar.issue.ignore.multicriteria=dockerProtocolPaths,appleGuestPaths,cliDefaultPaths,composeCliDefaultPaths,serviceDefaultPaths,valueModelInitializers,buildInfoInitializer,mutationInitializer
sonar.issue.ignore.multicriteria.dockerProtocolPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.dockerProtocolPaths.resourceKey=Sources/DevContainerDockerAPI/**
sonar.issue.ignore.multicriteria.appleGuestPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.appleGuestPaths.resourceKey=Sources/DevContainerAppleRuntime/**
sonar.issue.ignore.multicriteria.cliDefaultPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.cliDefaultPaths.resourceKey=Sources/DevContainerCLI/**
sonar.issue.ignore.multicriteria.composeCliDefaultPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.composeCliDefaultPaths.resourceKey=Sources/DevContainerComposeCLI/**
sonar.issue.ignore.multicriteria.serviceDefaultPaths.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.serviceDefaultPaths.resourceKey=Sources/DevContainerService/**
sonar.issue.ignore.multicriteria.valueModelInitializers.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.valueModelInitializers.resourceKey=Sources/**/*Models.swift
sonar.issue.ignore.multicriteria.buildInfoInitializer.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.buildInfoInitializer.resourceKey=Sources/DevContainerModel/BuildInfo.swift
sonar.issue.ignore.multicriteria.mutationInitializer.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.mutationInitializer.resourceKey=Sources/DevContainerCore/ProjectCoordinator.swift

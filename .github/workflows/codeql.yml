name: CodeQL

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    # CODEQL_ENABLED is intentionally unset/false while analysis is paused.
    # When re-enabled, draft pull requests remain outside the iterative cycle
    # and ready_for_review starts the analysis without another source change.
    if: >-
      vars.CODEQL_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prime resolved SwiftPM dependencies
        run: >-
          swift build --disable-automatic-resolution --arch arm64
          -Xswiftc -warnings-as-errors
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: swift
          build-mode: manual
      - name: Build first-party Swift
        run: |
          # Recompile repository sources under CodeQL without re-extracting the
          # already-built Apple container dependency graph.
          find Sources -type f -name '*.swift' -exec touch {} +
          swift build --disable-automatic-resolution --arch arm64 \
            -Xswiftc -warnings-as-errors
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

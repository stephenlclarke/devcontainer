name: CodeQL

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  require-main-push-enabled:
    name: Require CodeQL for main release checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when CodeQL is disabled
        env:
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run: |
          if [[ "${CODEQL_ENABLED}" != "true" ]]; then
            printf 'CodeQL is required for main release authority; set CODEQL_ENABLED=true.\n' >&2
            exit 1
          fi

  analyze:
    name: CodeQL
    # Draft pull requests remain outside the iterative analysis cycle.
    # Main release authority requires enabled analysis; ready_for_review starts
    # PR analysis without another source change.
    if: >-
      vars.CODEQL_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare exact enhanced dependency patches
        run: make swiftpm-prepare
      - name: Prime resolved SwiftPM dependencies
        run: >-
          swift build --disable-automatic-resolution --arch arm64
          -Xswiftc -warnings-as-errors
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: swift
          build-mode: manual
      - name: Build first-party Swift
        run: |
          # Recompile repository sources under CodeQL without re-extracting the
          # already-built Apple container dependency graph.
          find Sources -type f -name '*.swift' -exec touch {} +
          swift build --disable-automatic-resolution --arch arm64 \
            -Xswiftc -warnings-as-errors
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

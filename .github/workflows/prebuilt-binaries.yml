name: Prebuilt Binaries
run-name: Prebuilt Binaries · ${{ inputs.ref || github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "main for Current, or a bare semantic tag for stable"
        required: true
        type: string

permissions: read-all

concurrency:
  group: devcontainer-package-and-tap
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve publish context
    if: >
      github.repository == 'stephenlclarke/devcontainer' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.DEVCONTAINER_CURRENT_PUBLISH_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      lane: ${{ steps.publish.outputs.lane }}
      publish: ${{ steps.publish.outputs.publish }}
      ref_name: ${{ steps.publish.outputs.ref_name }}
      sha: ${{ steps.publish.outputs.sha }}
      parity_run_id: ${{ steps.publish.outputs.parity_run_id }}
      parity_artifact_id: ${{ steps.publish.outputs.parity_artifact_id }}
      parity_artifact_digest: ${{ steps.publish.outputs.parity_artifact_digest }}
      parity_artifact_size: ${{ steps.publish.outputs.parity_artifact_size }}
    steps:
      - name: Resolve trusted source and authorities
        id: publish
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          publish=false
          lane=""
          ref_name=""
          sha=""
          parity_run_id=""
          parity_artifact_id=""
          parity_artifact_digest=""
          parity_artifact_size=""

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${WORKFLOW_HEAD_BRANCH}" != "main" ]]; then
              printf 'ignoring non-main CI source %s\n' "${WORKFLOW_HEAD_BRANCH}"
            else
              lane=current
              ref_name=main
              sha="${WORKFLOW_HEAD_SHA}"
              publish=true
            fi
          elif [[ "${DISPATCH_REF}" == "main" ]]; then
            lane=current
            ref_name=main
            sha="$(
              git ls-remote --heads "${remote}" refs/heads/main \
                | awk '{ print $1 }' \
                | tail -n 1
            )"
            publish=true
          elif [[ "${DISPATCH_REF}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            lane=stable
            ref_name="${DISPATCH_REF}"
            tag_ref="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ref_name}"
            )"
            tag_type="$(jq -r '.object.type' <<<"${tag_ref}")"
            tag_object="$(jq -r '.object.sha' <<<"${tag_ref}")"
            if [[ "${tag_type}" != "tag" ]]; then
              printf 'stable source tag must be annotated\n' >&2
              exit 1
            fi
            tag_document="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
            )"
            if [[ "$(jq -r '.verification.verified' <<<"${tag_document}")" != "true" ]]; then
              printf 'stable source tag is not GitHub-verified\n' >&2
              exit 1
            fi
            sha="$(jq -r '.object.sha' <<<"${tag_document}")"
            authority=""
            authority_name="stable-authority-${ref_name}-${sha}"
            authority_root="${RUNNER_TEMP}/stable-authority"
            authority_runs="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow stable-release-gate.yml \
                --event workflow_dispatch \
                --limit 100 \
                --json databaseId,status,conclusion,createdAt,headBranch \
                --jq 'map(select(
                  .headBranch == "main" and
                  .status == "completed" and
                  .conclusion == "success"
                )) | sort_by(.createdAt) | reverse | .[].databaseId'
            )"
            while IFS= read -r run_id; do
              [[ -n "${run_id}" ]] || continue
              rm -rf "${authority_root}"
              mkdir -p "${authority_root}"
              set +e
              gh run download "${run_id}" \
                --repo "${GITHUB_REPOSITORY}" \
                --name "${authority_name}" \
                --dir "${authority_root}" \
                >/dev/null 2>&1
              download_status="$?"
              set -e
              if [[ "${download_status}" -ne 0 ]]; then
                continue
              fi
              if jq -e \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg release_tag "${ref_name}" \
                --arg candidate_sha "${sha}" \
                --arg run_id "${run_id}" \
                '(
                  .schemaVersion == 1 and
                  .repository == $repository and
                  .releaseTag == $release_tag and
                  .candidateSha == $candidate_sha and
                  .workflow == "Stable Release Gate" and
                  .runId == $run_id
                )' \
                "${authority_root}/stable-authority.json" >/dev/null
              then
                authority="${run_id}"
                break
              fi
            done <<<"${authority_runs}"
            if [[ ! "${authority}" =~ ^[0-9]+$ ]]; then
              printf 'candidate-bound stable authority is missing\n' >&2
              exit 1
            fi
            gate="$(
              gh run view "${authority}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json workflowName,event,status,conclusion,headBranch \
                --jq 'select(
                  .workflowName == "Stable Release Gate" and
                  .event == "workflow_dispatch" and
                  .headBranch == "main" and
                  .status == "completed" and
                  .conclusion == "success"
                ) | .conclusion'
            )"
            if [[ "${gate}" != "success" ]]; then
              printf 'stable authority does not resolve to a successful gate\n' >&2
              exit 1
            fi
            publish=true
          else
            printf 'unsupported package ref: %s\n' "${DISPATCH_REF}" >&2
            exit 1
          fi

          if [[ "${publish}" == "true" && ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'publish source is not a full commit SHA: %s\n' "${sha}" >&2
            exit 1
          fi
          if [[ "${lane}" == "current" ]]; then
            current_main="$(
              git ls-remote --heads "${remote}" refs/heads/main \
                | awk '{ print $1 }' \
                | tail -n 1
            )"
            if [[ "${sha}" != "${current_main}" ]]; then
              printf 'skipping superseded Current source %s; main is %s\n' \
                "${sha}" "${current_main}"
              publish=false
            fi
          fi
          if [[ "${publish}" == "true" && "${lane}" == "current" ]]; then
            required_workflows=(
              codeql.yml
              dependency-review.yml
              docs.yml
              homebrew.yml
              parity.yml
              quality.yml
              scorecard.yml
              sonar.yml
            )
            for workflow in "${required_workflows[@]}"; do
              deadline=$((SECONDS + 4800))
              while true; do
                run="$(
                  gh run list \
                    --repo "${GITHUB_REPOSITORY}" \
                    --workflow "${workflow}" \
                    --commit "${sha}" \
                    --limit 50 \
                    --json status,conclusion,headBranch,event,createdAt \
                    --jq 'map(select(
                      .headBranch == "main" and
                      .event == "push"
                    )) | sort_by(.createdAt) | reverse | .[0] // {}'
                )"
                status="$(jq -r '.status // empty' <<<"${run}")"
                conclusion="$(jq -r '.conclusion // empty' <<<"${run}")"
                if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
                  break
                fi
                if [[ "${status}" == "completed" ]]; then
                  printf '%s concluded %s for %s\n' \
                    "${workflow}" "${conclusion:-missing}" "${sha}" >&2
                  exit 1
                fi
                if (( SECONDS >= deadline )); then
                  printf 'timed out waiting for %s at %s\n' \
                    "${workflow}" "${sha}" >&2
                  exit 1
                fi
                printf 'waiting for %s at %s (status=%s)\n' \
                  "${workflow}" "${sha}" "${status:-missing}"
                sleep 30
              done
            done
          fi
          if [[ "${publish}" == "true" ]]; then
            parity_runs="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow parity.yml --event push --commit "${sha}" --limit 100 \
              --json databaseId,status,conclusion,headBranch,event,createdAt \
              --jq 'map(select(.headBranch == "main" and .event == "push")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            if [[ ! "${parity_runs}" =~ ^[0-9]+$ ]]; then
              printf 'successful exact-source main-push parity run is missing for %s\n' "${sha}" >&2
              exit 1
            fi
            parity_run_id="${parity_runs}"
            parity_run_document="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${parity_run_id}")"
            jq -e --argjson run_id "${parity_run_id}" --arg sha "${sha}" \
              '.id == $run_id and .path == ".github/workflows/parity.yml" and .event == "push" and .head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "success"' \
              <<<"${parity_run_document}" >/dev/null
            parity_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${parity_run_id}/artifacts")"
            parity_artifact="$(jq -ce '[.artifacts[] | select(.name == "parity-comparison" and .expired == false)] | if length == 1 then .[0] else error("expected exactly one unexpired parity-comparison artifact") end' <<<"${parity_artifacts}")"
            parity_artifact_id="$(jq -r '.id' <<<"${parity_artifact}")"
            parity_artifact_digest="$(jq -r '.digest | sub("^sha256:"; "")' <<<"${parity_artifact}")"
            parity_artifact_size="$(jq -r '.size_in_bytes' <<<"${parity_artifact}")"
            if [[ ! "${parity_artifact_id}" =~ ^[0-9]+$ || ! "${parity_artifact_digest}" =~ ^[0-9a-f]{64}$ \
                || ! "${parity_artifact_size}" =~ ^[0-9]+$ ]] \
                || (( parity_artifact_size <= 0 || parity_artifact_size > 67108864 )); then
              printf 'parity artifact ID or digest is malformed\n' >&2
              exit 1
            fi
          fi
          {
            printf 'lane=%s\n' "${lane}"
            printf 'publish=%s\n' "${publish}"
            printf 'ref_name=%s\n' "${ref_name}"
            printf 'sha=%s\n' "${sha}"
            printf 'parity_run_id=%s\n' "${parity_run_id}"
            printf 'parity_artifact_id=%s\n' "${parity_artifact_id}"
            printf 'parity_artifact_digest=%s\n' "${parity_artifact_digest}"
            printf 'parity_artifact_size=%s\n' "${parity_artifact_size}"
          } >>"${GITHUB_OUTPUT}"

  package:
    name: Verify native package, publish, and promote tap
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: [self-hosted, macOS, ARM64, devcontainer-release, devcontainer-designated-mbp]
    environment: release
    timeout-minutes: 180
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
          path: devcontainer
      - name: Check out pinned publication verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: |
            Tools
      - name: Require isolated ARM64 release identity
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NOTARY_PROFILE: ${{ vars.DEVCONTAINER_NOTARY_PROFILE }}
          SIGNING_IDENTITY: ${{ vars.DEVCONTAINER_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -n "${HOMEBREW_TAP_TOKEN}"
          test -n "${SIGNING_IDENTITY}"
          test -n "${NOTARY_PROFILE}"
          test "$(git -C devcontainer rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          test -z "$(git -C devcontainer status --short)"
          test "$(git -C release-tools rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git -C release-tools status --short)"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="${PWD}/release-tools/Tools/release" \
            python3 -c 'from homebrew_installation import LaunchdServices; LaunchdServices()'
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stephenlclarke/homebrew-tap
          fetch-depth: 0
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Download exact successful parity comparison bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PARITY_ARTIFACT_ID: ${{ needs.resolve.outputs.parity_artifact_id }}
          PARITY_ARTIFACT_SIZE: ${{ needs.resolve.outputs.parity_artifact_size }}
        run: |
          set -euo pipefail
          [[ "${PARITY_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${PARITY_ARTIFACT_SIZE}" =~ ^[0-9]+$ ]]
          (( PARITY_ARTIFACT_SIZE > 0 && PARITY_ARTIFACT_SIZE <= 67108864 ))
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARITY_ARTIFACT_ID}/zip" \
            >"${RUNNER_TEMP}/parity-comparison.zip"
          test -s "${RUNNER_TEMP}/parity-comparison.zip"
      - name: Require a clean tap
        run: |
          set -euo pipefail
          test -z "$(git -C homebrew-tap status --short)"
      - name: Verify signed and notarized native package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          DEVCONTAINER_NOTARY_PROFILE: ${{ vars.DEVCONTAINER_NOTARY_PROFILE }}
          DEVCONTAINER_SIGNING_IDENTITY: ${{ vars.DEVCONTAINER_SIGNING_IDENTITY }}
          DEVCONTAINER_NATIVE_FINALIZED_DIRECTORY: ${{ vars.DEVCONTAINER_NATIVE_FINALIZED_DIRECTORY }}
          DEVCONTAINER_NATIVE_FINALIZATION_SHA256: ${{ vars.DEVCONTAINER_NATIVE_FINALIZATION_SHA256 }}
          DEVCONTAINER_NATIVE_QUALIFICATION_SHA256: ${{ vars.DEVCONTAINER_NATIVE_QUALIFICATION_SHA256 }}
          DEVCONTAINER_NATIVE_SSD_SCRATCH: ${{ vars.DEVCONTAINER_NATIVE_SSD_SCRATCH }}
          DEVCONTAINER_NATIVE_RELEASE_PROFILE: stock
          LANE: ${{ needs.resolve.outputs.lane }}
          PUBLISH_SHA: ${{ needs.resolve.outputs.sha }}
        working-directory: devcontainer
        shell: bash
        run: |
          set -euo pipefail
          run_number=""
          if [[ "${LANE}" == "current" ]]; then
            run_number="${GITHUB_RUN_NUMBER}"
          fi
          make package \
            DEVCONTAINER_PACKAGE_LANE="${LANE}" \
            DEVCONTAINER_PACKAGE_RUN_NUMBER="${run_number}" \
            DEVCONTAINER_SIGNING_REQUIRED=1
          version="$(
            awk '$1 == "DEVCONTAINER_VERSION" && $2 == "?=" { print $3; exit }' \
              Makefile
          )"
          context_args=(
            --product-version "${version}"
            --lane "${LANE}"
            --commit "${PUBLISH_SHA}"
          )
          if [[ "${LANE}" == "current" ]]; then
            context_args+=(--run-number "${GITHUB_RUN_NUMBER}")
          fi
          asset="$(
            python3 Tools/release/package-context.py \
              "${context_args[@]}" \
              --field asset
          )"
          release_tag="$(
            python3 Tools/release/package-context.py \
              "${context_args[@]}" \
              --field releaseTag
          )"
          formula_version="$(
            python3 Tools/release/package-context.py \
              "${context_args[@]}" \
              --field formulaVersion
          )"
          archive="${PWD}/dist/${asset}"
          test -s "${archive}"
          test -s "${archive}.sha256"
          test -s "${archive}.context.json"
          test -s "${archive}.verification.json"

          assets="${RUNNER_TEMP}/devcontainer-release-assets"
          rm -rf "${assets}"
          mkdir -p "${assets}"
          cp "${archive}" "${archive}.sha256" \
            "${archive}.context.json" "${archive}.verification.json" \
            "${archive}.native-finalization-provenance.json" \
            "${assets}/"
          parity_run_json="${RUNNER_TEMP}/parity-workflow-run.json"
          parity_artifacts_json="${RUNNER_TEMP}/parity-workflow-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ needs.resolve.outputs.parity_run_id }}" \
            >"${parity_run_json}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ needs.resolve.outputs.parity_run_id }}/artifacts" \
            >"${parity_artifacts_json}"
          python3 "${GITHUB_WORKSPACE}/release-tools/Tools/release/verify_parity_release_evidence.py" \
            --repository "${PWD}" \
            --run-json "${parity_run_json}" \
            --artifact-json "${parity_artifacts_json}" \
            --run-id "${{ needs.resolve.outputs.parity_run_id }}" \
            --artifact-id "${{ needs.resolve.outputs.parity_artifact_id }}" \
            --artifact-digest "${{ needs.resolve.outputs.parity_artifact_digest }}" \
            --artifact-archive "${RUNNER_TEMP}/parity-comparison.zip" \
            --artifact-directory "${RUNNER_TEMP}/parity-comparison-verified" \
            --publish-sha "${PUBLISH_SHA}" \
            --archive "${archive}" \
            --checksum "${archive}.sha256" \
            --context "${archive}.context.json" \
            --verification "${archive}.verification.json" \
            --finalization-provenance "${archive}.native-finalization-provenance.json" \
            --finalization-sha256 "${DEVCONTAINER_NATIVE_FINALIZATION_SHA256}" \
            --qualification-sha256 "${DEVCONTAINER_NATIVE_QUALIFICATION_SHA256}" \
            --output-directory "${assets}"
          root="devcontainer-${version}/share/devcontainer"
          tar -xOf "${archive}" "${root}/build-info.json" \
            >"${assets}/build-info.json"
          tar -xOf "${archive}" "${root}/devcontainer.spdx.json" \
            >"${assets}/devcontainer.spdx.json"
          tar -xOf "${archive}" "${root}/notarization.json" \
            >"${assets}/notarization.json"
          jq -n \
            --arg sourceCommit "${PUBLISH_SHA}" \
            --arg verifierCommit "${{ github.sha }}" \
            --arg verifierSHA256 "$(
              shasum -a 256 "${GITHUB_WORKSPACE}/release-tools/Tools/release/verify_parity_release_evidence.py" \
                | awk '{ print $1 }'
            )" \
            --arg installationToolSHA256 "$(
              shasum -a 256 "${GITHUB_WORKSPACE}/release-tools/Tools/release/homebrew_installation.py" \
                | awk '{ print $1 }'
            )" \
            '{schemaVersion: 1, scope: "publication-verifier-identity", sourceCommit: $sourceCommit,
              verifierCommit: $verifierCommit, verifierSHA256: $verifierSHA256,
              installationToolSHA256: $installationToolSHA256}' \
            >"${assets}/publication-verifier.json"
          immutable_resume=false
          operation="${RUNNER_TEMP}/publication-operation.json"
          if [[ "${LANE}" == stable ]]; then
            python3 "${GITHUB_WORKSPACE}/release-tools/Tools/release/resume_immutable_release.py" \
              --repository "${GITHUB_REPOSITORY}" --tag "${release_tag}" \
              --assets "${assets}" --source-commit "${PUBLISH_SHA}" \
              --tool-commit "${{ github.sha }}" \
              --verifier "${GITHUB_WORKSPACE}/release-tools/Tools/release/verify_parity_release_evidence.py" \
              --installation-tool "${GITHUB_WORKSPACE}/release-tools/Tools/release/homebrew_installation.py" \
              --output "${operation}"
            immutable_resume="$(jq -r '.immutableResume' "${operation}")"
          fi
          find "${assets}" -maxdepth 1 -type f -print | sort \
            >"${RUNNER_TEMP}/release-assets.txt"

          notes="${RUNNER_TEMP}/release-notes.md"
          release_heading="${release_tag}"
          formula_name=devcontainer
          if [[ "${LANE}" == current ]]; then
            release_heading="Current build"
            formula_name=devcontainer-current
          fi
          apple_version="$(
            jq -r '.referencePins.appleContainer.stableVersion' \
              Tests/Parity/manifest.json
          )"
          compose_version="$(
            jq -r '.referencePins.containerCompose.stableVersion' \
              Tests/Parity/manifest.json
          )"
          docker_version="$(
            jq -r '.referencePins.docker.engineVersion' \
              Tests/Parity/manifest.json
          )"
          {
            printf '# %s\n\n' "${release_heading}"
            printf 'Signed, notarized Apple-silicon release built from '
            printf "[\`%s\`](https://github.com/%s/commit/%s).\\n\\n" \
              "${PUBLISH_SHA}" "${GITHUB_REPOSITORY}" "${PUBLISH_SHA}"
            printf '## Install with Homebrew\n\n'
            printf '```console\n'
            printf 'brew tap stephenlclarke/tap\n'
            printf 'brew trust --tap stephenlclarke/tap\n'
            printf 'brew install stephenlclarke/tap/%s\n' "${formula_name}"
            printf 'devcontainer version --format json\n'
            printf '```\n\n'
            printf "The formula installs the standalone \`devcontainer\` service, "
            printf 'Docker-compatible engine adapter, and Compose adapter. '
            printf "Stock Apple \`container\` is selected by default; "
            printf "\`container-compose\` remains an optional provider.\\n\\n"
            printf '## Certified compatibility\n\n'
            printf -- "- Apple \`container\` \`%s\`\\n" "${apple_version}"
            printf -- "- \`container-compose\` \`%s\`\\n" "${compose_version}"
            printf -- "- Docker Engine \`%s\` reference oracle\\n" "${docker_version}"
            printf -- '- Real VS Code Dev Containers sessions and the pinned '
            printf "\`@devcontainers/cli\` reference\\n\\n"
            printf 'Every published asset has a checksum, SPDX SBOM, '
            printf 'notarization evidence, build identity, and GitHub '
            printf 'provenance attestation.\n\n'
            printf '## Verify the archive\n\n'
            printf '```console\n'
            printf 'gh attestation verify %s --repo %s\n' \
              "${asset}" "${GITHUB_REPOSITORY}"
            printf 'shasum -a 256 -c %s.sha256\n' "${asset}"
            printf '```\n\n'
            printf 'See the [installation guide]'
            printf '(https://github.com/%s/blob/%s/INSTALL.md) ' \
              "${GITHUB_REPOSITORY}" "${PUBLISH_SHA}"
            printf 'and [DocC documentation]'
            printf '(https://stephenlclarke.github.io/api/devcontainer/) '
            printf 'for runtime selection, service control, upgrades, '
            printf 'and uninstalling.\n'
          } >"${notes}"
          {
            printf 'archive=%s\n' "${assets}/${asset}"
            printf 'immutable_resume=%s\n' "${immutable_resume}"
            printf 'assets=%s\n' "${assets}"
            printf 'assets_manifest=%s\n' "${RUNNER_TEMP}/release-assets.txt"
            printf 'asset=%s\n' "${asset}"
            printf 'formula_version=%s\n' "${formula_version}"
            printf 'notes=%s\n' "${notes}"
            printf 'release_tag=%s\n' "${release_tag}"
            printf 'version=%s\n' "${version}"
          } >>"${GITHUB_OUTPUT}"
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.assets }}/*
      - name: Upload signed package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devcontainer-${{ needs.resolve.outputs.lane }}-${{ needs.resolve.outputs.sha }}
          path: ${{ steps.package.outputs.assets }}
      - name: Attest resumed publication context
        if: needs.resolve.outputs.lane == 'stable'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-operation.json
      - name: Retain resumed publication context
        if: needs.resolve.outputs.lane == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-operation-context
          path: ${{ runner.temp }}/publication-operation.json
      - name: Stage GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_ASSETS_FILE: ${{ steps.package.outputs.assets_manifest }}
          RELEASE_NOTES_FILE: ${{ steps.package.outputs.notes }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.resolve.outputs.lane == 'current' && 'Current build' || steps.package.outputs.release_tag }}
        working-directory: devcontainer
        run: |
          set -euo pipefail
          if [[ "${{ steps.package.outputs.immutable_resume }}" == true ]]; then
            printf 'Authenticated immutable release assets retained without replacement.\n'
            exit 0
          fi
          mode=stable-stage
          if [[ "${{ needs.resolve.outputs.lane }}" == current ]]; then
            mode=current-stage
          fi
          Tools/release/publish-github-release.sh "${mode}"
      - name: Render and validate tap formula
        env:
          ASSET: ${{ steps.package.outputs.asset }}
          FORMULA_VERSION: ${{ steps.package.outputs.formula_version }}
          LANE: ${{ needs.resolve.outputs.lane }}
          PRODUCT_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          class=Devcontainer
          conflict_args=()
          formula=devcontainer.rb
          tag="${{ steps.package.outputs.release_tag }}"
          if [[ "${LANE}" == current ]]; then
            class=DevcontainerCurrent
            conflict_args=(--conflicts-with devcontainer)
            formula=devcontainer-current.rb
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${ASSET}"
          python3 devcontainer/Tools/release/render-homebrew-formula.py \
            --product-version "${PRODUCT_VERSION}" \
            --formula-version "${FORMULA_VERSION}" \
            --formula-class "${class}" \
            --url "${url}" \
            "${conflict_args[@]}" \
            --archive "${{ steps.package.outputs.archive }}" \
            --template devcontainer/Tools/release/devcontainer.rb.in \
            --output "homebrew-tap/Formula/${formula}"
          python3 devcontainer/Tools/release/update-tap-readme.py \
            --readme homebrew-tap/README.md \
            --source devcontainer/docs/homebrew-tap-README.md
          ruby -c "homebrew-tap/Formula/${formula}"

          changed="$(
            git -C homebrew-tap diff --name-only \
              | sort
          )"
          unexpected="$(
            comm -23 \
              <(printf '%s\n' "${changed}" | sed '/^$/d') \
              <(printf 'Formula/%s\nREADME.md\n' "${formula}" | sort)
          )"
          if [[ -n "${unexpected}" ]]; then
            printf 'unexpected tap changes:\n%s\n' "${changed}" >&2
            exit 1
          fi
          test -s "homebrew-tap/Formula/${formula}"
          test -s homebrew-tap/README.md
      - name: Commit candidate tap state locally
        env:
          LANE: ${{ needs.resolve.outputs.lane }}
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap config user.name "devcontainer release"
          git -C homebrew-tap config user.email \
            "devcontainer-release@users.noreply.github.com"
          git -C homebrew-tap add README.md Formula/devcontainer*.rb
          if git -C homebrew-tap diff --cached --quiet; then
            printf 'tap already contains the candidate %s state\n' "${LANE}"
          else
            git -C homebrew-tap commit \
              -m "chore(devcontainer): update ${LANE} formula"
          fi
      - name: Install and test tap formula
        env:
          LANE: ${{ needs.resolve.outputs.lane }}
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          formula=devcontainer
          if [[ "${LANE}" == current ]]; then
            formula=devcontainer-current
          fi
          formula_path="${PWD}/homebrew-tap/Formula/${formula}.rb"
          test_tap="stephenlclarke/devcontainer-release-ci-${GITHUB_RUN_ID}"
          python3 release-tools/Tools/release/homebrew_installation.py \
            --formula-path "${formula_path}" \
            --test-tap "${test_tap}" \
            --lane "${LANE}" \
            --expected-source-sha "${{ needs.resolve.outputs.sha }}" \
            --finalized-context "${{ steps.package.outputs.archive }}.context.json" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --ssd-scratch "/Volumes/SSD/cf/bazel/tmp/homebrew-installation-${GITHUB_RUN_ID}" \
            --retained-root "${HOME}/Library/Application Support/ContainerFamily/retained/workflow/homebrew-installations" \
            --receipt-output "${RUNNER_TEMP}/homebrew-installation.json"
      - name: Retain installation and restoration evidence
        if: always()
        uses: ./devcontainer/Tools/ci/upload-artifact-action
        with:
          name: homebrew-installation-restoration
          path: ${{ runner.temp }}/homebrew-installation.json
      - name: Push tested tap state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C homebrew-tap status --short)"
          git -C homebrew-tap push origin main
      - name: Finalize release after tap promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_ASSETS_FILE: ${{ steps.package.outputs.assets_manifest }}
          RELEASE_NOTES_FILE: ${{ steps.package.outputs.notes }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.resolve.outputs.lane == 'current' && 'Current build' || steps.package.outputs.release_tag }}
        working-directory: devcontainer
        run: |
          set -euo pipefail
          mode=stable-finalize
          if [[ "${{ needs.resolve.outputs.lane }}" == current ]]; then
            mode=current-finalize
          fi
          Tools/release/publish-github-release.sh "${mode}"

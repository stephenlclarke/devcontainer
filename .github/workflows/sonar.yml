name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube analysis
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact dependencies
        run: |
          cp Package.resolved /tmp/devcontainer-Package.resolved
          swift package resolve
          cmp /tmp/devcontainer-Package.resolved Package.resolved

      - name: Generate and enforce Swift coverage
        env:
          SWIFT_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SWIFT_COVERAGE_SCRATCH_PATH: .build
          SWIFT_TEST_ATTEMPTS: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "300"
        run: make coverage-check

      - name: Detect SonarQube credentials
        id: sonar_credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${SONAR_TOKEN}" ]]; then
            printf 'configured=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'configured=false\n' >> "${GITHUB_OUTPUT}"
            {
              printf '## SonarQube analysis blocked\n\n'
              printf 'SONAR_TOKEN is unavailable. The required SonarQube '
              printf 'analysis cannot be skipped; fork changes must be '
              printf 'validated from a maintainer-owned branch.\n'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Cache SonarQube packages
        if: steps.sonar_credentials.outputs.configured == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sonar
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sonar

      - name: Install verified Sonar Scanner CLI
        if: steps.sonar_credentials.outputs.configured == 'true'
        env:
          SONAR_SCANNER_GPG_FINGERPRINT: 679F1EE92B19609DE816FDE81DB198F93525EC1A
          SONAR_SCANNER_VERSION: 8.1.0.6389
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              scanner_flavor="macosx-aarch64"
              ;;
            x86_64)
              scanner_flavor="macosx-x64"
              ;;
            *)
              printf 'Unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          scanner_name="sonar-scanner-cli-${SONAR_SCANNER_VERSION}-${scanner_flavor}"
          scanner_url="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${scanner_name}.zip"
          scanner_zip="${RUNNER_TEMP}/${scanner_name}.zip"
          scanner_signature="${scanner_zip}.asc"
          scanner_root="${RUNNER_TEMP}/sonar-scanner-cli"
          gpg_home="${RUNNER_TEMP}/sonar-scanner-gpg"

          rm -rf "${scanner_root}" "${gpg_home}"
          mkdir -p "${scanner_root}" "${gpg_home}"
          chmod 700 "${gpg_home}"

          curl --fail --location --silent --show-error \
            "${scanner_url}" --output "${scanner_zip}"
          curl --fail --location --silent --show-error \
            "${scanner_url}.asc" --output "${scanner_signature}"
          gpg --homedir "${gpg_home}" --batch \
            --keyserver hkps://keys.openpgp.org \
            --recv-keys "${SONAR_SCANNER_GPG_FINGERPRINT}"
          actual_fingerprint="$(
            gpg --homedir "${gpg_home}" --batch --with-colons \
              --fingerprint "${SONAR_SCANNER_GPG_FINGERPRINT}" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "${actual_fingerprint}" != "${SONAR_SCANNER_GPG_FINGERPRINT}" ]]; then
            printf 'Unexpected Sonar Scanner signing key: %s\n' \
              "${actual_fingerprint}" >&2
            exit 1
          fi
          gpg --homedir "${gpg_home}" --batch \
            --verify "${scanner_signature}" "${scanner_zip}"
          unzip -q "${scanner_zip}" -d "${scanner_root}"

          scanner_bin="${scanner_root}/sonar-scanner-${SONAR_SCANNER_VERSION}-${scanner_flavor}/bin"
          test -x "${scanner_bin}/sonar-scanner"
          printf '%s\n' "${scanner_bin}" >> "${GITHUB_PATH}"

      - name: Validate SonarQube project identity
        if: steps.sonar_credentials.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          branches="$(
            curl --fail --silent --show-error \
              --user "${SONAR_TOKEN}:" \
              "https://sonarcloud.io/api/project_branches/list?project=stephenlclarke_devcontainer"
          )"
          new_code="$(
            curl --fail --silent --show-error \
              --user "${SONAR_TOKEN}:" \
              "https://sonarcloud.io/api/settings/values?component=stephenlclarke_devcontainer&keys=sonar.leak.period,sonar.leak.period.type"
          )"
          jq -e '
            any(
              .branches[];
              .name == "main" and .isMain == true
            )
          ' <<< "${branches}" >/dev/null
          jq -e '
            (
              [.settings[] | select(.key == "sonar.leak.period") | .value]
              == ["previous_version"]
            ) and (
              [.settings[] | select(.key == "sonar.leak.period.type") | .value]
              == ["previous_version"]
            )
          ' <<< "${new_code}" >/dev/null

      - name: SonarQube scan
        if: steps.sonar_credentials.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number }}
          SONAR_PULL_REQUEST_BRANCH: ${{ github.head_ref }}
          SONAR_PULL_REQUEST_BASE: ${{ github.base_ref }}
          SONAR_QUALITYGATE_WAIT: "true"
        run: make sonar-scan

      - name: Require a clean SonarQube project
        if: steps.sonar_credentials.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          scope=(--data-urlencode branch=main)
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            scope=(
              --data-urlencode "pullRequest=${{ github.event.pull_request.number }}"
              --data-urlencode inNewCodePeriod=true
            )
          fi
          issues="$(
            curl --fail --silent --show-error \
              --user "${SONAR_TOKEN}:" \
              --get \
              --data-urlencode componentKeys=stephenlclarke_devcontainer \
              --data-urlencode resolved=false \
              "${scope[@]}" \
              --data-urlencode ps=100 \
              https://sonarcloud.io/api/issues/search
          )"
          hotspots="$(
            curl --fail --silent --show-error \
              --user "${SONAR_TOKEN}:" \
              --get \
              --data-urlencode projectKey=stephenlclarke_devcontainer \
              --data-urlencode status=TO_REVIEW \
              "${scope[@]}" \
              --data-urlencode ps=100 \
              https://sonarcloud.io/api/hotspots/search
          )"
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            measures="$(
              curl --fail --silent --show-error \
                --user "${SONAR_TOKEN}:" \
                --get \
                --data-urlencode component=stephenlclarke_devcontainer \
                --data-urlencode metricKeys=coverage,duplicated_lines_density,reliability_rating,security_rating,sqale_rating,bugs,vulnerabilities,code_smells \
                --data-urlencode branch=main \
                https://sonarcloud.io/api/measures/component
            )"
          fi
          if ! jq -e '.total == 0' <<<"${issues}" >/dev/null; then
            jq -r '
              .issues[] |
              "\(.severity) \(.rule) \(.component):\(.line // 0) \(.message)"
            ' <<<"${issues}" >&2
            exit 1
          fi
          if ! jq -e '.paging.total == 0' <<<"${hotspots}" >/dev/null; then
            jq -r '
              .hotspots[] |
              "\(.vulnerabilityProbability) \(.component):\(.line // 0) \(.message)"
            ' <<<"${hotspots}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            jq -e '
              def metric($name):
                [.component.measures[] | select(.metric == $name) | .value | tonumber][0];
              metric("coverage") >= 90
                and metric("duplicated_lines_density") <= 3
                and metric("reliability_rating") == 1
                and metric("security_rating") == 1
                and metric("sqale_rating") == 1
                and metric("bugs") == 0
                and metric("vulnerabilities") == 0
                and metric("code_smells") == 0
            ' <<<"${measures}" >/dev/null
          fi

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage.lcov
            .build/codecov-path
            .build/sonar-coverage-revision
            .build/swift-coverage.log
          include-hidden-files: true
          if-no-files-found: error

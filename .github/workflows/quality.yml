name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sanitizer:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SWIFT_ASAN_SCRATCH_PATH: .build
      SWIFT_TSAN_SCRATCH_PATH: .build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Address Sanitizer
            target: test-asan
          - name: Thread Sanitizer
            target: test-tsan
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve exact dependencies
        run: |
          cp Package.resolved /tmp/devcontainer-Package.resolved
          swift package resolve
          cmp /tmp/devcontainer-Package.resolved Package.resolved
      - name: Run sanitizer
        env:
          SWIFT_TEST_ATTEMPTS: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "3600"
        run: make "${{ matrix.target }}"
      - name: Upload sanitizer log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: .build/swift-*.log
          include-hidden-files: true
          if-no-files-found: error

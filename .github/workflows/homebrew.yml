name: Homebrew

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: Homebrew
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create package and formula
        run: make homebrew-formula
      - name: Validate formula
        run: |
          set -euo pipefail
          ruby -c dist/devcontainer.rb
          tap_name="stephenlclarke/devcontainer-ci"
          cleanup() {
            brew untap "${tap_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          brew tap-new --no-git "${tap_name}"
          tap_root="$(brew --repository "${tap_name}")"
          cp dist/devcontainer.rb "${tap_root}/Formula/devcontainer.rb"
          brew style --formula "${tap_name}/devcontainer"
      - name: Upload package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: homebrew-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.rb

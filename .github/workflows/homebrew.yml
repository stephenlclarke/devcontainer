name: Homebrew

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  formula:
    name: Homebrew
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create package and formula
        run: |
          make homebrew-formula
          make homebrew-formula-current \
            DEVCONTAINER_PACKAGE_RUN_NUMBER="${GITHUB_RUN_NUMBER}"
      - name: Validate formula
        run: |
          set -euo pipefail
          ruby -c dist/devcontainer.rb
          tap_name="stephenlclarke/devcontainer-ci"
          cleanup() {
            brew untap "${tap_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          brew tap-new --no-git "${tap_name}"
          tap_root="$(brew --repository "${tap_name}")"
          cp dist/devcontainer.rb "${tap_root}/Formula/devcontainer.rb"
          cp dist/devcontainer-current.rb \
            "${tap_root}/Formula/devcontainer-current.rb"
          brew style --formula "${tap_name}/devcontainer"
          brew style --formula "${tap_name}/devcontainer-current"
      - name: Upload package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: homebrew-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.rb
            dist/*.json

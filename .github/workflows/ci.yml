name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install quality tools
        run: brew install actionlint markdownlint-cli shellcheck swiftformat swiftlint
      - name: Resolve exact dependencies
        run: |
          cp Package.resolved /tmp/devcontainer-Package.resolved
          swift package resolve
          cmp /tmp/devcontainer-Package.resolved Package.resolved
      - name: Validate source
        run: make format-check lint parity-manifest
      - name: Test and enforce coverage
        env:
          SWIFT_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SWIFT_COVERAGE_SCRATCH_PATH: .build
          SWIFT_TEST_ATTEMPTS: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "300"
        run: make coverage-check
      - name: Build
        run: make build
      - name: CLI smoke
        run: |
          .build/debug/devcontainer version --format json | jq -e '.version'
          .build/debug/devcontainer context --format value | grep '^unix://'
          DEVCONTAINER_DOCKER_BIN="$PWD/Tools/ci/docker-compose-smoke-fixture.sh" \
            DEVCONTAINER_STATE="${RUNNER_TEMP}/devcontainer-smoke-state.sqlite" \
            .build/debug/devcontainer-compose version \
            | jq -e '.Version == "fixture"'
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-evidence
          path: |
            .build/*.log
            .build/codecov-path
            coverage.lcov
            coverage.xml
          include-hidden-files: true
          if-no-files-found: ignore

  stock-test:
    name: Stock Apple tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DEVCONTAINER_RUNTIME_PROFILE: stock
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the stock dependency lock
        run: cp Package.stock.resolved Package.resolved
      - name: Resolve stock dependencies
        run: |
          cp Package.resolved /tmp/devcontainer-stock-Package.resolved
          swift package resolve
          cmp /tmp/devcontainer-stock-Package.resolved Package.resolved
      - name: Test against unmodified Apple packages
        run: swift test --disable-automatic-resolution -Xswiftc -warnings-as-errors
      - name: Smoke test stock-profile products
        run: |
          .build/debug/devcontainer version --format json | jq -e '.version'
          .build/debug/devcontainer-engine --help | grep 'Apple container'

  validate:
    name: Validate
    if: always()
    needs: [test, stock-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          STOCK_RESULT: ${{ needs.stock-test.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success && test "$STOCK_RESULT" = success
